name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact version, not @v9: this action publishes no floating major tag,
      # so @v9 is unresolvable and the job dies before checkout.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Reads .python-version, so CI and the laptop run the same interpreter.
      - name: Install Python
        run: uv python install

      # --locked fails rather than silently resolving, so a pyproject edit
      # that never made it into uv.lock is caught here and not in Phase 5.
      - name: Sync dependencies
        run: uv sync --locked

      # An independent verifier for the MCAP files we write. It found a
      # log_time bug the test suite passed clean over, so it runs here rather
      # than only on somebody's laptop.
      - name: Install the mcap CLI
        env:
          MCAP_CLI_VERSION: v0.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/mcap" \
            "https://github.com/foxglove/mcap/releases/download/releases/mcap-cli/${MCAP_CLI_VERSION}/mcap-linux-amd64"
          chmod +x "$RUNNER_TEMP/bin/mcap"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the mcap CLI is usable
        run: mcap --version

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check src tests

      - name: Tests
        env:
          # Turns "mcap CLI missing, skipping" into a failure. A conformance
          # check that silently skips in CI is not a check.
          BRAIN_REQUIRE_MCAP_CLI: "1"
        run: uv run pytest
