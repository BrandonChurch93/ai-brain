[project]
name = "brain"
version = "0.1.0"
description = "Shared robot brain: planning, perception, memory, safety, telemetry; many bodies via a versioned adapter protocol."
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format-nongpl]>=4.23",
    "mcap>=1.4",
    "pydantic>=2.13",
    # The floor is what the code actually needs: `websockets.asyncio`, which
    # arrived in 13.0. It used to read >=17.0, which was "whatever was newest
    # in step 1.2" rather than a requirement, and google-genai caps the same
    # package below 17, so the tighter pin made one provider SDK
    # uninstallable. The effective ceiling now comes from that extra and
    # lifts on its own when upstream relaxes.
    "websockets>=13.0",
]

[project.optional-dependencies]
# Only a machine with a camera needs OpenCV, and CI has neither a camera nor
# anyone to answer a macOS permission prompt. Install with:
#   uv sync --extra laptop
laptop = [
    "opencv-python>=5.0",
    "sounddevice>=0.5",
]
# Provider SDKs, same reasoning as the capture hardware: the default install
# and CI must need neither an SDK nor an API key. Each provider is separately
# installable so a machine that only ever talks to one is not made to carry
# four. Install all of them with:
#   uv sync --extra llm
anthropic = ["anthropic>=0.120"]
openai = ["openai>=2.53"]
google = ["google-genai>=2.17"]
ollama = ["ollama>=0.6"]
llm = [
    "anthropic>=0.120",
    "openai>=2.53",
    "google-genai>=2.17",
    "ollama>=0.6",
]

[project.scripts]
# Runs the mock body as its own process, which is how a body actually
# deploys: separate process, dials the brain (ADR-0001, ADR-0002).
mock-body = "bodies.mock:main"
laptop-body = "bodies.laptop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain", "src/bodies", "src/wire"]

[dependency-groups]
dev = [
    "hypothesis>=6.164",
    "hypothesis-jsonschema>=0.23",
    "pillow>=12.3",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Also how anything that launches a process must find the packages. On macOS
# uv writes its editable-install .pth with the UF_HIDDEN flag, and CPython's
# site.addpackage silently skips hidden .pth files, so `src/` never reaches
# sys.path and imports fail with no explanation. Scripts that start a brain
# or a body set PYTHONPATH=src for the same reason.
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: consumes real wall-clock time; the suite keeps at most one",
    "camera: needs a real camera and a granted macOS permission; local only",
    "speaker: makes audible noise through the real synthesiser; local only",
    "llm_smoke: calls a real model over the network and costs money; local only",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
